name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same branch / PR.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ and ios/
        run: bash tool/bootstrap_platforms.sh

      - run: flutter pub get

      # Infos are reported but do not fail; warnings and errors do.
      - run: flutter analyze --no-fatal-infos

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      # Flutter's current Android template uses AGP 9.x and Java 17
      # (flutter_tools gradle_utils.dart: errorJavaMinVersionAndroid = 17).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ and ios/
        run: bash tool/bootstrap_platforms.sh

      - run: flutter pub get

      # The generated template signs release builds with the debug key.
      # That is fine for V1 sideloading, but every CI runner has a different
      # debug key, so an update may require uninstalling the previous APK.
      # Add a real keystore (via repository secrets) before wider distribution.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v6
        with:
          name: cassette-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ and ios/
        run: bash tool/bootstrap_platforms.sh

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      # Sideloadly re-signs the app with the user's Apple ID at install time.
      - name: Package unsigned IPA
        run: |
          rm -rf Payload cassette-unsigned.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr cassette-unsigned.ipa Payload

      - uses: actions/upload-artifact@v6
        with:
          name: cassette-ios-unsigned
          path: cassette-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish 'latest' release
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cassette-android
          path: dist/android

      - uses: actions/download-artifact@v7
        with:
          name: cassette-ios-unsigned
          path: dist/ios

      - name: Rename files
        run: |
          mkdir -p release
          mv dist/android/app-release.apk release/Cassette.apk
          mv dist/ios/cassette-unsigned.ipa release/Cassette-unsigned.ipa
          ls -l release

      - name: Write release notes
        run: |
          cat > release/NOTES.md <<'EOF'
          Automatic build of the latest commit on `main`.

          **Android**
          1. Open this page on your phone and tap **Cassette.apk**.
          2. When asked, allow your browser to *install unknown apps*, then tap Install.

          **iPhone**
          1. On a computer, download **Cassette-unsigned.ipa** and install it with [Sideloadly](https://sideloadly.io) using your Apple ID.
          2. On the iPhone: Settings > Privacy & Security > **Developer Mode** > On (restart when asked).
          3. Settings > General > VPN & Device Management > tap your Apple ID > **Trust**.
          4. With a free Apple ID the app expires after 7 days; re-install with Sideloadly to renew.
          EOF

      # Recreate the 'latest' prerelease so its tag points at this commit and
      # the assets are replaced.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Cassette (latest build)" \
            --notes-file release/NOTES.md \
            release/Cassette.apk \
            release/Cassette-unsigned.ipa
