name: cassette_player
description: Cassette Player - a local-only music library. Your music stays on your phone.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Playback engine (ExoPlayer on Android, AVPlayer on iOS) + lock-screen / notification controls
  just_audio: ^0.10.0
  just_audio_background: 0.0.1-beta.17
  audio_session: ^0.2.0
  # Library database (SQLite on the device)
  sqflite: ^2.4.0
  # Import: file picking, tag parsing, hashing
  file_picker: ">=8.0.0 <11.0.0"
  audio_metadata_reader: ^1.8.0
  crypto: ^3.0.6
  # Paths and state
  path_provider: ^2.1.4
  path: ^1.9.0
  provider: ^6.1.2
  # YouTube audio import. Only used by builds made with
  # --dart-define=YOUTUBE_IMPORT=true (see lib/core/features.dart).
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#F0A23B"
  adaptive_icon_background: "#F0A23B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
